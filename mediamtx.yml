# The RTMP server OBS streams to. It takes a stream only with the right
# password, which FFmpeg listening by itself never checked: it took any
# stream key. The relay reads the stream back from here and sends it on.

logLevel: info
logDestinations: [stdout]

# How long OBS can send nothing before it's taken as gone, rather than
# MediaMTX's 10 seconds: OBS sends many times a second, so 5 quiet seconds
# is a connection that's dropped, and with the fallback, the platforms get
# its clip that much sooner, before they give up waiting themselves
readTimeout: 5s

# One user, for OBS to publish as and the relay to read and ask after the
# stream as. Its password is INBOUND_STREAM_KEY, given in docker-compose.yml
# as MTX_AUTHINTERNALUSERS_0_PASS, so it's never in this file; the compose
# file won't start without it. Replacing the defaults, which let anyone
# publish and read anything.
authMethod: internal
authInternalUsers:
  - user: relay
    pass: set-by-MTX_AUTHINTERNALUSERS_0_PASS
    ips: []
    permissions:
      - action: publish
        path: live
      - action: read
        path: live
      - action: api

# For the relay to see when a stream comes in. Reached only on the stack's
# own network, since only RTMP's port is published.
api: true
apiAddress: :9997

# OBS streams by RTMP, or by SRT, which copes better with a connection that
# drops packets; nothing uses the others
rtmp: true
rtmpAddress: :1935
srt: true
srtAddress: :8890
rtsp: false
hls: false
webrtc: false
moq: false
metrics: false
pprof: false
playback: false

paths:
  live:
    # Recording what comes in, to ./recordings on the server, if RECORD=true
    # in .env; docker-compose.yml gives these from .env as
    # MTX_PATHS_LIVE_RECORD and MTX_PATHS_LIVE_RECORDDELETEAFTER
    record: false
    # A file an hour, named for when it starts, in UTC, in recordings/live/:
    # MediaMTX won't start without %path in it, recording or not
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S%z
    recordSegmentDuration: 1h
    # Fragmented MP4, written a second at a time, so a crash loses at most
    # the last second
    recordFormat: fmp4
    recordPartDuration: 1s
    # Deleted after RECORD_KEEP, 0s to keep them for good
    recordDeleteAfter: 7d
    # The fallback: while OBS has dropped out, a clip plays on repeat in its
    # place, so the platforms keep the stream going, if FALLBACK=true in .env,
    # given as MTX_PATHS_LIVE_ALWAYSAVAILABLE. OBS must then send what the
    # clip is made of, H.264 video and AAC audio at 48 kHz in stereo, or
    # MediaMTX turns it away.
    alwaysAvailable: false
    # The clip, in ./fallback: be-right-back.mp4, or FALLBACK_FILE, given as
    # MTX_PATHS_LIVE_ALWAYSAVAILABLEFILE
    alwaysAvailableFile: /fallback/be-right-back.mp4
    # Recording only what OBS sends: the clip, which plays whenever OBS
    # isn't there, would otherwise be recorded day and night
    alwaysAvailableRecorded: false
    # What encrypts the stream from OBS by SRT, if SRT_PASSPHRASE is set in
    # .env, given as MTX_PATHS_LIVE_SRTPUBLISHPASSPHRASE; RTMP isn't
    # encrypted either way
    srtPublishPassphrase:
